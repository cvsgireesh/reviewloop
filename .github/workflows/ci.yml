name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - name: Prepare pinned native patch test helper
        run: npm install --prefix "$RUNNER_TEMP/reviewloop-codex" @openai/codex@0.159.0 --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          REVIEWLOOP_CODEX_TEST_BIN: ${{ runner.temp }}/reviewloop-codex/node_modules/.bin
      - run: npm run build
      - name: Validate packaged CLI and bundled reference fixtures
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/reviewloop-package" "$RUNNER_TEMP/cvsgireesh-reviewloop-$(node -p 'require("./package.json").version').tgz" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/reviewloop-package/node_modules/.bin/reviewloop" --help
          "$RUNNER_TEMP/reviewloop-package/node_modules/.bin/reviewloop" evaluate --reference --output "$RUNNER_TEMP/reviewloop-reference"
